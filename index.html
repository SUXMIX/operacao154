<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Isabelly ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <h1>Isabelly</h1>
    <p class="subtitle">Hoje o universo tem um motivo especial para existir.</p>
    <button id="enterBtn">Clique aqui</button>
  </section>

  <!-- CARTA -->
  <section class="section hidden" id="letterSection">
    <h2>Uma carta para você</h2>
    <p id="typedText"></p>
  </section>

  <!-- CONTADOR -->
  <section class="section hidden" id="counterSection">
    <h2>Desde que você entrou na minha vida...</h2>
    <p id="counter"></p>
  </section>

  <!-- GALERIA -->
  <section class="section hidden" id="gallerySection">
    <h2>Nossas Memórias</h2>
    <div class="gallery">
      <div class="photo">
        <img src="https://via.placeholder.com/250" alt="">
        <div class="overlay">Nesse dia eu percebi que você era diferente.</div>
      </div>
      <div class="photo">
        <img src="https://via.placeholder.com/250" alt="">
        <div class="overlay">Seu sorriso mudou meu mundo.</div>
      </div>
    </div>
  </section>

  <!-- CONSTELAÇÃO -->
  <section class="section hidden" id="starsSection">
    <canvas id="starsCanvas"></canvas>
    <div class="finalMessage">
      Mesmo no meio do universo, eu escolheria você.
      <button id="secretBtn">Não clique</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
