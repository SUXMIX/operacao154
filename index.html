<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Isabelly ❤️</title>

<style>

/* =========================
   RESET & BASE
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body, html {
    height: 100%;
    overflow: hidden;
    background: black;
}

/* =========================
   BACKGROUND COM BLUR + VINHETA
========================= */

.background {
    position: fixed;
    inset: 0;
    background-image: url('https://i.ibb.co/fJ186QQ/IMG-20251118-WA0101.jpg');
    background-size: cover;
    background-position: center;
    filter: blur(10px);
    transform: scale(1.1);
    z-index: -2;
}

.overlay-dark {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, 
        rgba(0,0,0,0.3) 0%, 
        rgba(0,0,0,0.6) 60%, 
        rgba(0,0,0,0.85) 100%);
    z-index: -1;
}

/* =========================
   MAIN CONTAINER
========================= */

.container {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    animation: fadeIn 1.8s ease forwards;
}

.content {
    max-width: 900px;
}

h1 {
    color: white;
    font-size: clamp(22px, 4vw, 40px);
    font-weight: 300;
    margin-bottom: 40px;
    letter-spacing: 1px;
    animation: floatText 4s ease-in-out infinite;
}

/* =========================
   BOTÃO FOGO + ÁGUA
========================= */

.button-wrapper {
    position: relative;
    display: inline-block;
}

#magicButton {
    position: relative;
    padding: 18px 50px;
    font-size: 20px;
    border: none;
    background: black;
    color: white;
    cursor: pointer;
    letter-spacing: 2px;
    border-radius: 50px;
    z-index: 2;
    overflow: hidden;
}

#magicButton:hover {
    transform: scale(1.05);
    transition: 0.3s ease;
}

/* Canvas para animação */

#fireWaterCanvas {
    position: absolute;
    inset: -8px;
    border-radius: 60px;
    z-index: 1;
}

/* =========================
   EM BREVE PAGE
========================= */

#comingSoon {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(30px, 6vw, 70px);
    letter-spacing: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
}

#comingSoon.active {
    opacity: 1;
    pointer-events: all;
}

/* =========================
   ANIMAÇÕES
========================= */

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes floatText {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
}

/* =========================
   RESPONSIVIDADE EXTRA
========================= */

@media (max-width: 500px) {
    #magicButton {
        padding: 15px 35px;
        font-size: 16px;
    }
}

</style>
</head>

<body>

<div class="background"></div>
<div class="overlay-dark"></div>

<div class="container">
    <div class="content">
        <h1>Isabelly, você está preparada para ver o que fiz para você?</h1>
        
        <div class="button-wrapper">
            <canvas id="fireWaterCanvas"></canvas>
            <button id="magicButton">SIM!</button>
        </div>
    </div>
</div>

<div id="comingSoon">EM BREVE</div>

<script>

/* =========================
   CANVAS FOGO + ÁGUA REALISTA
========================= */

const canvas = document.getElementById("fireWaterCanvas");
const ctx = canvas.getContext("2d");
const button = document.getElementById("magicButton");

function resizeCanvas() {
    canvas.width = button.offsetWidth + 16;
    canvas.height = button.offsetHeight + 16;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let particles = [];

class Particle {
    constructor(type) {
        this.type = type; // fire or water
        this.angle = Math.random() * Math.PI * 2;
        this.radius = button.offsetWidth / 2 + 10;
        this.speed = 0.01 + Math.random() * 0.01;
        this.size = 2 + Math.random() * 3;
    }

    update() {
        this.angle += this.speed;
    }

    draw() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        let gradient;

        if (this.type === "fire") {
            gradient = ctx.createRadialGradient(x, y, 0, x, y, this.size * 3);
            gradient.addColorStop(0, "rgba(255,200,0,1)");
            gradient.addColorStop(0.5, "rgba(255,80,0,0.8)");
            gradient.addColorStop(1, "rgba(255,0,0,0)");
        } else {
            gradient = ctx.createRadialGradient(x, y, 0, x, y, this.size * 3);
            gradient.addColorStop(0, "rgba(0,200,255,1)");
            gradient.addColorStop(0.5, "rgba(0,100,255,0.8)");
            gradient.addColorStop(1, "rgba(0,0,255,0)");
        }

        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, this.size * 3, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < 80; i++) {
    particles.push(new Particle(i % 2 === 0 ? "fire" : "water"));
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
        p.update();
        p.draw();
    });

    requestAnimationFrame(animate);
}

animate();

/* =========================
   TRANSIÇÃO
========================= */

button.addEventListener("click", () => {
    document.querySelector(".container").style.opacity = "0";
    document.querySelector(".container").style.transition = "1s ease";

    setTimeout(() => {
        document.getElementById("comingSoon").classList.add("active");
    }, 1000);
});

</script>

</body>
</html>
