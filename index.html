<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Isabelly ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fire-color: #ff4d00;
            --water-color: #008cff;
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #000;
        }

        /* Container Principal */
        #main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }

        /* Fundo com foto, desfoque e vinheta */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/fJ186QQ/IMG-20251118-WA0101.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px) brightness(0.5);
            z-index: -2;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.9) 100%);
            z-index: -1;
        }

        /* Conteúdo */
        .content {
            text-align: center;
            color: var(--text-color);
            padding: 20px;
            max-width: 600px;
            z-index: 10;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        /* O BOTÃO E AS ANIMAÇÕES DE FOGO/ÁGUA */
        .btn-wrapper {
            position: relative;
            display: inline-block;
            padding: 40px; /* Espaço para as chamas/água rodarem */
        }

        .main-button {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 50px;
            z-index: 5;
            transition: transform 0.3s ease, background 0.3s ease;
            outline: none;
        }

        .main-button:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Container dos elementos fluídos (Efeito Gooey) */
        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: blur(12px) contrast(25); /* Mágica do fogo/água */
            pointer-events: none;
        }

        .element {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Fogo (Laranja/Vermelho) */
        .fire {
            background: var(--fire-color);
            box-shadow: 0 0 20px var(--fire-color);
            animation: rotateFire 4s infinite linear;
        }

        /* Água (Azul) */
        .water {
            background: var(--water-color);
            box-shadow: 0 0 20px var(--water-color);
            animation: rotateWater 4s infinite linear;
        }

        /* Animações de Rotação Orbital */
        @keyframes rotateFire {
            0% { transform: rotate(0deg) translateX(70px) scale(1); }
            50% { transform: rotate(180deg) translateX(70px) scale(1.3); }
            100% { transform: rotate(360deg) translateX(70px) scale(1); }
        }

        @keyframes rotateWater {
            0% { transform: rotate(180deg) translateX(70px) scale(1.3); }
            50% { transform: rotate(360deg) translateX(70px) scale(1); }
            100% { transform: rotate(540deg) translateX(70px) scale(1.3); }
        }

        /* Adicionando múltiplas "gotas" para parecer mais orgânico */
        .fire-2 { animation-delay: -1s; width: 30px; }
        .water-2 { animation-delay: -0.5s; width: 35px; }

        /* Tela de EM BREVE */
        #soon-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #soon-page h2 {
            color: white;
            font-size: 3rem;
            letter-spacing: 10px;
            font-weight: 300;
            animation: fadeInOut 3s infinite ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* Responsividade */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .main-button { padding: 12px 35px; font-size: 1rem; }
            @keyframes rotateFire {
                0% { transform: rotate(0deg) translateX(55px) scale(1); }
                100% { transform: rotate(360deg) translateX(55px) scale(1); }
            }
            @keyframes rotateWater {
                0% { transform: rotate(180deg) translateX(55px) scale(1); }
                100% { transform: rotate(540deg) translateX(55px) scale(1); }
            }
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div class="background-overlay"></div>
        <div class="vignette"></div>
        
        <div class="content">
            <h1>Isabelly, você está preparada para ver o que fiz para você?</h1>
            
            <div class="btn-wrapper">
                <div class="particles-container">
                    <div class="element fire"></div>
                    <div class="element fire fire-2"></div>
                    <div class="element water"></div>
                    <div class="element water water-2"></div>
                </div>
                
                <button class="main-button" onclick="startTransition()">SIM!</button>
            </div>
        </div>
    </div>

    <div id="soon-page">
        <h2>EM BREVE</h2>
    </div>

    <script>
        function startTransition() {
            const main = document.getElementById('main-container');
            const soon = document.getElementById('soon-page');

            // Efeito de fade out
            main.style.opacity = '0';
            
            setTimeout(() => {
                main.style.display = 'none';
                soon.style.display = 'flex';
                // Pequeno delay para o fade in do texto novo
                soon.style.opacity = '0';
                setTimeout(() => {
                    soon.style.opacity = '1';
                }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
