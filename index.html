<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Isabelly ❤️</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET E CONFIGURAÇÕES
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body, html {
    height: 100%;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

/* =========================
   TELA 1 - INTRO
========================= */

.section {
    position: absolute;
    width: 100%;
    height: 100%;
    transition: opacity 1.2s ease, transform 1.2s ease;
}

.hidden {
    opacity: 0;
    pointer-events: none;
    transform: scale(1.1);
}

/* Fundo com imagem + blur */
.intro {
    background: url('https://i.ibb.co/fJ186QQ/IMG-20251118-WA0101.jpg') center/cover no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Camada de blur + escurecimento */
.intro::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    backdrop-filter: blur(8px);
    background: radial-gradient(circle at center, 
        rgba(0,0,0,0.3) 40%, 
        rgba(0,0,0,0.8) 100%);
}

/* Conteúdo central */
.content {
    position: relative;
    text-align: center;
    color: white;
    padding: 20px;
    max-width: 700px;
    animation: fadeUp 1.5s ease forwards;
}

.content h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(28px, 4vw, 48px);
    margin-bottom: 40px;
    line-height: 1.4;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
}

/* =========================
   BOTÃO ROMÂNTICO
========================= */

.love-btn {
    position: relative;
    padding: 18px 60px;
    font-size: 20px;
    font-weight: 600;
    color: white;
    background: linear-gradient(45deg, #ff4e8a, #ff1f5a);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.3s ease;
    box-shadow: 0 0 25px rgba(255, 78, 138, 0.6);
}

.love-btn:hover {
    transform: scale(1.1);
}

/* Brilho animado */
.love-btn::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.3), transparent 60%);
    animation: rotateGlow 6s linear infinite;
}

/* Corações flutuando */
.heart {
    position: absolute;
    font-size: 18px;
    animation: float 3s linear infinite;
    opacity: 0.8;
}

/* =========================
   TELA 2 - EM BREVE
========================= */

.coming {
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(30px, 5vw, 60px);
    letter-spacing: 5px;
    font-weight: 600;
}

/* =========================
   ANIMAÇÕES
========================= */

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes float {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-80px) scale(1.5);
        opacity: 0;
    }
}

@keyframes rotateGlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* =========================
   RESPONSIVO EXTRA
========================= */

@media (max-width: 600px) {
    .content h1 {
        font-size: 24px;
    }
    .love-btn {
        padding: 15px 40px;
        font-size: 16px;
    }
}

</style>
</head>

<body>

<!-- TELA INTRO -->
<section class="section intro" id="intro">
    <div class="content">
        <h1>Isabelly, você está preparada para ver o que fiz para você?</h1>
        <button class="love-btn" id="loveBtn">SIM! 💖</button>
    </div>
</section>

<!-- TELA EM BREVE -->
<section class="section coming hidden" id="coming">
    EM BREVE
</section>

<script>

/* =========================
   BOTÃO + TRANSIÇÃO
========================= */

const btn = document.getElementById("loveBtn");
const intro = document.getElementById("intro");
const coming = document.getElementById("coming");

btn.addEventListener("click", () => {
    intro.classList.add("hidden");

    setTimeout(() => {
        coming.classList.remove("hidden");
    }, 1000);
});

/* =========================
   GERAR CORAÇÕES DINÂMICOS
========================= */

btn.addEventListener("mouseenter", () => {
    for(let i = 0; i < 10; i++){
        const heart = document.createElement("span");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";

        const size = Math.random() * 20 + 10;
        heart.style.left = Math.random() * btn.offsetWidth + "px";
        heart.style.top = btn.offsetHeight / 2 + "px";
        heart.style.fontSize = size + "px";
        heart.style.animationDuration = (Math.random() * 2 + 2) + "s";

        btn.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 3000);
    }
});

</script>

</body>
</html>
