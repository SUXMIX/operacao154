<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Para Isabelly ❤️</title>
    <style>
        /* Reset e estilos globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Páginas */
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-in-out;
        }

        #page1 {
            z-index: 2;
            opacity: 1;
        }

        #page1.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #page2 {
            background: black;
            color: white;
            z-index: 1;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 0.5rem;
            text-transform: uppercase;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
            display: none;
            flex-direction: column;
            gap: 2rem;
            text-align: center;
        }

        #page2.show {
            display: flex;
        }

        /* Fundo da página 1 com overlay e desfoque */
        .page1-bg {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: url('https://i.ibb.co/fJ186QQ/IMG-20251118-WA0101.jpg') center/cover no-repeat;
            filter: blur(8px) brightness(0.7);
            z-index: -2;
        }

        .page1-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.6) 90%);
            z-index: -1;
        }

        /* Conteúdo da página 1 */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.2rem, 8vw, 4.5rem);
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7), 0 0 20px rgba(255,215,0,0.5);
            margin-bottom: 2rem;
            line-height: 1.3;
            letter-spacing: 2px;
            animation: fadeIn 2s ease;
        }

        /* Container do botão com efeitos de fogo e água */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 2rem;
        }

        .btn-wrapper {
            position: relative;
            display: inline-block;
            animation: fadeInUp 2s ease 0.3s both;
        }

        /* Botão principal */
        #simBtn {
            position: relative;
            z-index: 20;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            padding: 1.2rem 3.5rem;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800;
            border-radius: 60px;
            color: #222;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), 0 0 40px rgba(255,215,0,0.3);
            letter-spacing: 4px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Montserrat', sans-serif;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255,255,255,0.5);
        }

        #simBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(255,69,0,0.6), 0 0 60px rgba(0,191,255,0.6);
        }

        /* Redemoinhos de fogo e água */
        .fire-whirl, .water-whirl {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(70vw, 500px);
            height: min(70vw, 500px);
            border-radius: 50%;
            opacity: 0.7;
            pointer-events: none;
            z-index: 5;
            mix-blend-mode: screen;
            filter: blur(20px) brightness(1.3);
        }

        .fire-whirl {
            background: conic-gradient(from 0deg, 
                #ff4500, #ff8c00, #ffd700, 
                #ff4500, #ff8c00, #ffd700, 
                #ff4500, #ff8c00, #ffd700);
            animation: rotateFire 12s linear infinite;
        }

        .water-whirl {
            background: conic-gradient(from 0deg, 
                #00bfff, #1e90ff, #87cefa, 
                #00bfff, #1e90ff, #87cefa, 
                #00bfff, #1e90ff, #87cefa);
            animation: rotateWater 15s linear infinite reverse;
        }

        /* Camadas extras para mais profundidade */
        .fire-whirl::after {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            background: conic-gradient(from 45deg, 
                #ff8c00, #ff4500, #ffd700, 
                #ff8c00, #ff4500, #ffd700);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.9;
            animation: rotateFire 8s linear infinite reverse;
        }

        .water-whirl::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 60%;
            height: 60%;
            background: conic-gradient(from 30deg, 
                #1e90ff, #00bfff, #e0ffff, 
                #1e90ff, #00bfff, #e0ffff);
            border-radius: 50%;
            filter: blur(15px);
            opacity: 0.9;
            animation: rotateWater 10s linear infinite;
        }

        /* Animações */
        @keyframes rotateFire {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotateWater {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade para telas menores */
        @media (max-width: 600px) {
            .title {
                font-size: 2.5rem;
                margin-bottom: 1.5rem;
            }
            #simBtn {
                padding: 1rem 2.5rem;
                font-size: 2.2rem;
            }
            .fire-whirl, .water-whirl {
                width: 90vw;
                height: 90vw;
            }
            #page2 {
                font-size: 3rem;
            }
        }

        @media (max-width: 380px) {
            .title {
                font-size: 2rem;
            }
            #simBtn {
                font-size: 1.8rem;
                padding: 0.8rem 2rem;
            }
        }

        /* Fonte Great Vibes do Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;800&display=swap');
    </style>
</head>
<body>
    <div id="page1" class="page">
        <div class="page1-bg"></div>
        <div class="page1-overlay"></div>
        <div class="content">
            <h1 class="title">Isabelly, você está preparada para ver o que fiz para você?</h1>
            <div class="btn-container">
                <div class="btn-wrapper">
                    <button id="simBtn">SIM!</button>
                    <div class="fire-whirl"></div>
                    <div class="water-whirl"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="page2" class="page">
        <div>EM BREVE</div>
    </div>

    <script>
        (function() {
            // Elementos
            const page1 = document.getElementById('page1');
            const page2 = document.getElementById('page2');
            const simBtn = document.getElementById('simBtn');

            // Função para trocar de página
            function showPage2() {
                // Esconde página 1 com transição suave
                page1.classList.add('hidden');
                
                // Mostra página 2 após um pequeno delay para coincidir com a transição
                setTimeout(() => {
                    page2.classList.add('show');
                }, 100); // quase junto com a opacidade
            }

            // Evento de clique no botão
            simBtn.addEventListener('click', showPage2);

            // Pré-carregar a imagem de fundo para evitar flash
            const img = new Image();
            img.src = 'https://i.ibb.co/fJ186QQ/IMG-20251118-WA0101.jpg';
        })();
    </script>
</body>
</html>
