<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Isabelly ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
</head>
<body>

    <main id="intro-screen" class="active">
        <div class="background-overlay"></div>
        <div class="content">
            <h1 class="fade-in">Isabelly, você está preparada para ver o que fiz para você?</h1>
            
            <div class="button-wrapper fade-in-delayed">
                <button id="btn-start">
                    <span class="btn-text">SIM!</span>
                    <div class="orbit fire"></div>
                    <div class="orbit water"></div>
                </button>
            </div>
        </div>
    </main>

    <section id="soon-screen">
        <h2 class="typing-effect">EM BREVE</h2>
    </section>

    <script src="script.js"></script>
</body>
</html>
